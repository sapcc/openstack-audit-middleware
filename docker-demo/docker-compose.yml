services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5673:5672"
      - "15673:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  audit-demo:
    build:
      context: ..
      dockerfile: docker-demo/Dockerfile
    ports:
      - "8083:8080"
    environment:
      AUDIT_DRIVER: raw_amqp
      AUDIT_TRANSPORT_URL: "rabbit://guest:guest@rabbitmq:5672/"
      AUDIT_MAP: /app/etc/nova_audit_map.yaml
    depends_on:
      rabbitmq:
        condition: service_healthy
